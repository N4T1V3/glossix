name: Build Glossix Windows installer
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Connect the public release repository
        run: npm run configure:updates -- https://github.com/${{ github.repository }}
      - name: Build the Windows installer and update metadata
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Glossix-Windows-release
          path: |
            ../installer/Glossix-Setup-*.exe
            ../installer/*.blockmap
            ../installer/latest.yml
          if-no-files-found: error
