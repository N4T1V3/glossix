name: Build signed Glossix Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Connect the public release repository
        run: npm run configure:updates -- https://github.com/${{ github.repository }}
      - name: Build the Windows installer and update metadata
        run: npm run dist:win:signed
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Glossix-Windows-release
          path: |
            ../installer/Glossix-Setup-*.exe
            ../installer/*.blockmap
            ../installer/latest.yml
          if-no-files-found: error
